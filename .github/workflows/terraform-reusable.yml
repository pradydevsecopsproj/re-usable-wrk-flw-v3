# "workflow_call" makes a workflow reusable. 
# "workflow_call" work on JOB level not steps level
# Use "with" for inputs
# Use "secrets" for sensitive data like secrets
name: "Reusable Terraform CI/CD"

on:
  workflow_call:

    inputs:

      environment:
        description: "Terraform environment: dev, test or prod"
        required: true
        type: string

      terraform_version:
        description: "Terraform CLI version"
        required: false
        type: string
        default: "1.15.3"

      tflint_version:
        description: "TFLint version"
        required: false
        type: string
        default: "v0.52.0"

      working_directory:
        description: "Terraform root directory"
        required: false
        type: string
        default: "./Infra-repo/root"

      tfvars_file:
        description: "Terraform variable file"
        required: true
        type: string

      run_apply:
        description: "Whether Terraform Apply should execute"
        required: false
        type: boolean
        default: false

      trivy_exit_code:
        description: "Trivy exit code"
        required: false
        type: string
        default: "1"

    secrets:

      AWS_ROLE_ARN:
        description: "AWS IAM role ARN used with GitHub OIDC"
        required: true

# =====================================================================
# GLOBAL ENVIRONMENT VARIABLES
# =====================================================================

env:

  TF_LOG: INFO
  # Terraform provider/plugin cache
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

  # Terraform CLI configuration file
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/.terraformrc

jobs:

  # ============================================================
  # TERRAFORM PLAN
  # ============================================================

  terraform-plan:

    name: "Terraform Plan - ${{ inputs.environment }}"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    # outputs:
    #   environment: ${{ inputs.environment }}
    #   plan_artifact: tfplan-${{ inputs.environment }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
     

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ========================================================
      # CREATE TERRAFORM PLUGIN CACHE DIRECTORY
      # ========================================================
      
      - name: Create Terraform plugin cache directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TF_PLUGIN_CACHE_DIR"

          echo "Terraform plugin cache directory:"
          echo "$TF_PLUGIN_CACHE_DIR"


      # ========================================================
      # CONFIGURE TERRAFORM PLUGIN CACHE
      # ========================================================

      - name: Configure Terraform CLI plugin cache
        shell: bash
        run: |
          set -euo pipefail

          cat > "$TF_CLI_CONFIG_FILE" <<EOF
          plugin_cache_dir = "$TF_PLUGIN_CACHE_DIR"
          EOF

          echo "Terraform CLI configuration:"
          cat "$TF_CLI_CONFIG_FILE"
      # -----------------------------------------------------------------
      #  CACHE TERRAFORM PROVIDERS
      # -----------------------------------------------------------------

      - name: Cache Terraform providers
        id: terraform-provider-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-provider-${{ runner.os }}-${{ runner.arch }}-${{ inputs.terraform_version }}-${{ hashFiles('Infra-repo/root/.terraform.lock.hcl') }}

          restore-keys: |
            terraform-provider-${{ runner.os }}-${{ runner.arch }}-${{ inputs.terraform_version }}-


      # -----------------------------------------------------------------
      # SHOW CACHE STATUS
      # -----------------------------------------------------------------

      - name: Display Terraform cache status
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.terraform-provider-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "Terraform provider cache HIT"
          else
            echo "Terraform provider cache MISS"
          fi

          echo ""
          echo "Terraform plugin cache contents:"
          find "$TF_PLUGIN_CACHE_DIR" -maxdepth 5 -type f 2>/dev/null || true

      # ----------------------------------------------------------
      # Terraform + TFLint
      # ----------------------------------------------------------

      - name: Setup Terraform tooling
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ inputs.terraform_version }}
          tflint_version: ${{ inputs.tflint_version }}
          github_token: ${{ github.token }}

      # -----------------------------------------------------------------
      # CACHE TFLINT PLUGINS
      # -----------------------------------------------------------------

      - name: Cache TFLint plugins
        uses: actions/cache@v4
        with:

          path: ~/.tflint.d/plugins

          key: tflint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tflint_version }}-${{ hashFiles('Infra-repo/root/.tflint.hcl') }}

          restore-keys: |
            tflint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.tflint_version }}-

      # ----------------------------------------------------------
      # AWS authentication through OIDC
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      # -----------------------------------------------------------------
      # VERIFY AWS IDENTITY
      # -----------------------------------------------------------------
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------

      - name: Terraform Init
        run: |
          set -euo pipefail
          terraform init -input=false


      # ----------------------------------------------------------
      # Quality checks
      # ----------------------------------------------------------

      - name: Terraform quality checks
        uses: ./.github/actions/terraform-quality
        with:
          working_directory: ${{ inputs.working_directory }}
          github_token: ${{ github.token }}


      # ----------------------------------------------------------
      # Security scans
      # ----------------------------------------------------------

      - name: Terraform security scans
        uses: ./.github/actions/terraform-security
        with:
          working_directory: ${{ inputs.working_directory }}
          checkov_soft_fail: "false"
          trivy_exit_code: ${{ inputs.trivy_exit_code }}
          trivy_severity: "CRITICAL,HIGH"


      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------

      - name: Terraform plan
        id: terraform-plan
        uses: ./.github/actions/terraform-plan
        with:
          working_directory: ${{ inputs.working_directory }}
          environment: ${{ inputs.environment }}
          tfvars_file: ${{ inputs.tfvars_file }}
          plan_file: tfplan

      # -----------------------------------------------------------------
      # VERIFY TERRAFORM PLAN FILE
      # -----------------------------------------------------------------

      - name: Verify Terraform plan file
        shell: bash
        run: |
          set -euo pipefail

          PLAN_FILE="${{ inputs.working_directory }}/tfplan"

          if [[ ! -f "$PLAN_FILE" ]]; then
            echo "ERROR: Terraform plan file was not created."
            echo "Expected file:"
            echo "$PLAN_FILE"
            exit 1
          fi

          echo "Terraform plan file successfully created:"
          ls -lh "$PLAN_FILE"

      # ----------------------------------------------------------
      # Upload immutable plan artifact
      # ----------------------------------------------------------

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          # Include SHA so the artifact can be associated with
          # the exact Git commit that generated it.
          name: tfplan-${{ inputs.environment }}-${{ github.sha }}
          path: ${{ inputs.working_directory }}/tfplan
          if-no-files-found: error
          retention-days: 7


      # ----------------------------------------------------------
      # PR comment
      # ----------------------------------------------------------

      - name: Comment Terraform result on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const environment = '${{ inputs.environment }}';

            const body = [
              '## Terraform Plan',
              '',
              `**Environment:** \`${environment}\``,
              `**Terraform:** \`${{ inputs.terraform_version }}\``,
              '',
              'Terraform formatting, validation, TFLint, security scans and plan completed.',
              '',
              `**Workflow:** ${context.workflow}`,
              `**Commit:** ${context.sha}`
            ].join('\n');
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });


  # ============================================================
  # TERRAFORM APPLY
  # ============================================================

  terraform-apply:

    name: "Terraform Apply - ${{ inputs.environment }}"
    needs:
      - terraform-plan

    if: ${{ inputs.run_apply == true }}
    runs-on: ubuntu-latest
    # ---------------------------------------------------------------
    # GitHub Environment
    #
    # If the environment has required reviewers configured,
    # GitHub pauses the job before deployment.
    # ---------------------------------------------------------------
    environment:
      name: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}

    steps:
      # ----------------------------------------------------------
      # Checkout EXACT commit
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # -----------------------------------------------------------------
      # CREATE TERRAFORM PLUGIN CACHE DIRECTORY
      # -----------------------------------------------------------------
      - name: Create Terraform plugin cache directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # -----------------------------------------------------------------
      # CONFIGURE TERRAFORM PLUGIN CACHE
      # -----------------------------------------------------------------
      - name: Configure Terraform CLI plugin cache
        shell: bash
        run: |
          set -euo pipefail

          cat > "$TF_CLI_CONFIG_FILE" <<EOF
          plugin_cache_dir = "$TF_PLUGIN_CACHE_DIR"
          EOF

          echo "Terraform CLI configuration:"
          cat "$TF_CLI_CONFIG_FILE"

      # -----------------------------------------------------------------
      # RESTORE TERRAFORM PROVIDER CACHE
      # -----------------------------------------------------------------
      - name: Cache Terraform providers
        id: terraform-provider-cache
        uses: actions/cache@v4
        with:

          path: ${{ github.workspace }}/.terraform.d/plugin-cache

          key: terraform-provider-${{ runner.os }}-${{ runner.arch }}-${{ inputs.terraform_version }}-${{ hashFiles('Infra-repo/root/.terraform.lock.hcl') }}

          restore-keys: |
            terraform-provider-${{ runner.os }}-${{ runner.arch }}-${{ inputs.terraform_version }}-

      # -----------------------------------------------------------------
      # DISPLAY CACHE STATUS
      # -----------------------------------------------------------------

      - name: Display Terraform cache status
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.terraform-provider-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "Terraform provider cache HIT"
          else
            echo "Terraform provider cache MISS"
          fi

          echo ""
          echo "Terraform plugin cache:"
          find "$TF_PLUGIN_CACHE_DIR" -maxdepth 5 -type f 2>/dev/null || true    
      # ----------------------------------------------------------
      # Terraform
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
      # ----------------------------------------------------------
      # AWS OIDC
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com
      # -----------------------------------------------------------------
      # VERIFY AWS IDENTITY
      # -----------------------------------------------------------------
      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity    

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------
      - name: Terraform Init
        run: |
          set -euo pipefail
          terraform init -input=false    

      # ----------------------------------------------------------
      # Workspace
      # ----------------------------------------------------------

      - name: Select Terraform workspace
        env:
          TF_WORKSPACE_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          echo "Terraform workspace: $TF_WORKSPACE_NAME"
          terraform workspace select "$TF_WORKSPACE_NAME" \
            || terraform workspace new "$TF_WORKSPACE_NAME"

      # ----------------------------------------------------------
      # Download exact plan generated by PLAN job
      # ----------------------------------------------------------
      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ github.sha }}
          path: ${{ inputs.working_directory }}

      # -----------------------------------------------------------------
      # VERIFY DOWNLOADED PLAN
      # -----------------------------------------------------------------

      - name: Verify downloaded Terraform plan
        shell: bash
        run: |
          set -euo pipefail

          PLAN_FILE="${{ inputs.working_directory }}/tfplan"

          if [[ ! -f "$PLAN_FILE" ]]; then
            echo "ERROR: Terraform plan artifact was not downloaded."
            echo "Expected:"
            echo "$PLAN_FILE"
            exit 1
          fi

          echo "Downloaded Terraform plan:"
          ls -lh "$PLAN_FILE"    

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------
      - name: Terraform Apply
        run: |
          set -euo pipefail

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan